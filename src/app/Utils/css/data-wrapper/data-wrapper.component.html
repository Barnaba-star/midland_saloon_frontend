<div class="wrapper" >
  <h2 *ngIf="title">{{ title | translate }}</h2>

  <ng-container *ngIf="hasData; else noDataBlock">
    <ng-content></ng-content>
  </ng-container>

  <ng-template #noDataBlock>
    <div class="no-data">
      <p>{{ 'UTIL_T.NO_DATA' | translate }}</p>
    </div>
  </ng-template>
</div>
