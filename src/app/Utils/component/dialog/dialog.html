<!-- Close sits in the corner, over the title row - no empty band above the form. -->
<button mat-icon-button type="button" class="dlg-close" (click)="onClose()" [attr.aria-label]="'COMMON.CLOSE' | translate">
  <mat-icon>close</mat-icon>
</button>


<app-form
  [fields]="fields"
  [initialData]="initialFormData"
  [formTitle]="formTitle"
  (submitForm)="onSubmitFromChild($event)">
</app-form>
