<mat-vertical-stepper linear>
  <ng-container *ngFor="let step of steps; let i = index">
    <mat-step [stepControl]="formGroups[i]">
      <form [formGroup]="formGroups[i]">
        <ng-template matStepLabel>{{ 'UTIL_T.STEP_N' | translate: { n: i + 1 } }}</ng-template>
        <app-form
          [fields]="step"
          [initialData]="initialData"
          [formTitle]="formTitle"
        ></app-form>

        <div style="margin-top: 16px;">
          <button mat-button matStepperPrevious *ngIf="i > 0">{{ 'COMMON.BACK' | translate }}</button>
          <button mat-button matStepperNext *ngIf="i < steps.length - 1">{{ 'COMMON.NEXT' | translate }}</button>
          <button mat-button color="primary" (click)="submit()" *ngIf="i === steps.length - 1">
            {{ 'COMMON.SUBMIT' | translate }}
          </button>
        </div>
      </form>
    </mat-step>
  </ng-container>
</mat-vertical-stepper>
