  <button mat-icon-button (click)="onClose()" [attr.aria-label]="'COMMON.CLOSE' | translate">
    <mat-icon>close</mat-icon>
  </button>
<h2 mat-dialog-title>{{ data.formTitle | translate }}</h2>



<mat-dialog-content>
  <ng-container *ngIf="(data.formData?.length || 0) > 0; else singleForm">
    <div *ngFor="let form of data.formData; let i = index">

  <div class="form-actions" *ngIf="data.showDeleteButton">
<p style="font-size: 18px; block-size: 12px; font-weight: bold; margin-left: 30px;">
   {{ 'UTIL_T.NO_N' | translate }} {{form.index}}
</p>

  <div class="icon-group" style="margin-right: 20px;">
    <img *ngIf="data.showAddButton"
         src="assets/icons/add.svg"
         [alt]="'UTIL_T.ADD' | translate"
         class="icon-btn"
         (click)="addForm()"/>
    <img src="assets/icons/delete.svg"
         [alt]="'COMMON.DELETE' | translate"
         class="icon-btn"
         (click)="deleteForm()" />
  </div>
</div>

      <app-form
        [fields]="data.fields || []"
        [initialData]="form"
        (submitForm)="onSubmit()">
      </app-form>

    </div>


  </ng-container>
  <ng-template #singleForm>
    <app-form *ngIf="data.fields"
              [fields]="data.fields || []"
             (submitForm)="onSubmit()">
    </app-form>
  </ng-template>

</mat-dialog-content>
