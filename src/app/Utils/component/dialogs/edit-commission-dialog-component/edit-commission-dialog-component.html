<div class="edit-commission-header">
  <div>
    <h3>{{ 'SETTING_PAGE.TOOLTIP_EDIT_COMMISSION' | translate }}</h3>
    <p>{{ serviceName }}</p>
  </div>
  <button mat-icon-button type="button" (click)="onCancel()" [attr.aria-label]="'COMMON.CLOSE' | translate">
    <mat-icon>close</mat-icon>
  </button>
</div>

<div class="edit-commission-body">
  @for (row of rows; track row.code) {
    <div class="edit-commission-row">
      <label>{{ row.name | translate }}</label>
      <div class="edit-commission-input">
        <input
          type="number"
          min="0"
          max="100"
          step="0.01"
          [(ngModel)]="row.percent"
          [ngModelOptions]="{ standalone: true }"
        />
        <span>%</span>
      </div>
    </div>
  }
</div>

<div
  class="edit-commission-total"
  [class.complete]="totalPercent === 100"
  [class.over]="totalPercent > 100"
>
  <span>{{ 'COMMON.TOTAL' | translate }}</span>
  <strong>{{ totalPercent | number: '1.2-2' }}%</strong>
</div>

<div class="edit-commission-actions">
  <button mat-stroked-button type="button" (click)="onCancel()">{{ 'COMMON.CANCEL' | translate }}</button>
  <button mat-flat-button color="primary" type="button" (click)="onSave()">
    <mat-icon>save</mat-icon>
    {{ 'UTIL_T.SAVE_CHANGES' | translate }}
  </button>
</div>
